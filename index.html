<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAREA 10: Maquetación con Grid</title>

    <style>

        body {
        font-family: 'Times New Roman', serif;
        padding: 20px;
        }

        h1 {
        font-size: 24px;
        margin-bottom: 20px;
        text-align: center;
        }

        #container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 150px); 
        gap: 15px; 
        max-width: 900px;
        border: 2px solid grey;
        padding: 10px;
        margin: 0 auto;

        grid-template-areas: 
            "uno dos dos tres"
            "uno cinco siete cuatro"
            "uno ocho seis cuatro";
        }

        .caja {
        width: 100%;
        height: 100%;
        border: 1px solid black; 
        color: white;
        display: grid;
        align-content: center;
        text-align: center;
        font-weight: bold;
        font-size: 14px;
        }

        .uno { 
        grid-area: uno; 
        background-color: green; 
        }

        .dos { 
        grid-area: dos; 
        background-color: green;
        }

        .tres { 
        grid-area: tres; 
        background-color: red; 
        }

        .cuatro { 
        grid-area: cuatro; 
        background-color: green; 
        }

        .cinco { 
        grid-area: cinco; 
        background-color: orange; 
        }

        .seis { 
        grid-area: seis; 
        background-color: orange; 
        }

        .siete { 
        grid-area: siete; 
        background-color: red; 
        }

        .ocho { 
        grid-area: ocho; 
        background-color: red; 
        }

    </style>

</head>

<body>

  <h1>Grid 1</h1>

  <div id="container">

    <div class="caja uno">UNO</div>
    <div class="caja dos">DOS</div>
    <div class="caja tres">TRES</div>
    <div class="caja cuatro">CUATRO</div>
    <div class="caja cinco">CINCO</div>
    <div class="caja seis">SEIS</div>
    <div class="caja siete">SIETE</div>
    <div class="caja ocho">OCHO</div>

  </div>

</body>

</html>
